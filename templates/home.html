<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agricultural Yield Prediction</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f7f7f7;
            font-family: Arial, sans-serif;
        }
        .form-box {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border: 1px solid #ddd;
        }
        h2 {
            font-size: 24px;
            color: #000;
            text-align: center;
            margin-bottom: 20px;
        }
        .btn-simple {
            width: 100%;
            background: #000;
            color: #fff;
            border: none;
            padding: 10px;
        }
        .btn-simple:hover {
            background: #333;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #000;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="form-box">
    <h2>Agricultural Yield Prediction</h2>

    <form action="{{ url_for('predict_datapoint') }}" method="post">
        <div class="mb-3">
            <label class="form-label">Soil Quality (%)</label>
            <input class="form-control" type="number" name="Soil_Quality" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Seed Variety</label>
            <input class="form-control" type="number" name="Seed_Variety" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Fertilizer Amount (kg/hectare)</label>
            <input class="form-control" type="number" name="Fertilizer_Amount_kg_per_hectare" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Sunny Days</label>
            <input class="form-control" type="number" name="Sunny_Days" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Rainfall (mm)</label>
            <input class="form-control" type="number" name="Rainfall_mm" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Irrigation Schedule</label>
            <input class="form-control" type="number" name="Irrigation_Schedule" required>
        </div>

        <button class="btn btn-simple" type="submit">Predict</button>
    </form>

    {% if results %}
    <div class="result-box">
        <strong>Predicted Yield:</strong> {{ results }} kg/hectare
    </div>
    {% endif %}
</div>

</body>
</html>
